recipe_version: "2"
model: iromu/qwen25-1.5b-tools-GGUF:Q4_K_M
runtime: llama-cpp
container: scitrera/dgx-spark-llama-cpp:b10549-cu131

metadata:
  description: iromu/qwen25-1.5b-tools-GGUF:Q4_K_M
  model_params: 1.5B

defaults:
  port: 8080
  host: 0.0.0.0
  max_model_len: 262144
  tensor_parallel: 1
  kv_cache_dtype: q8_0
  n_gpu_layers: 999

command: |
  llama-server \
      -hf {model} \
      --host {host} \
      --port {port} \
      --ctx-size {max_model_len} \
      --cache-type-k {kv_cache_dtype} \
      --cache-type-v {kv_cache_dtype} \
      --n-gpu-layers {n_gpu_layers} \
      --flash-attn on \
      --jinja \
      --no-webui \  
      --no-mmap \
      --temp 0.6 \
      --top-p 0.95 \
      --top-k 20 \
      --min-p 0.00 

