# https://forums.developer.nvidia.com/t/bfloat16-quality-speed/366828/73
recipe_version: "2"
model: Intel/Qwen3.5-122B-A10B-int4-AutoRound
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-tf5:latest

metadata:
  description: Qwen3.5-122B-A10B INT4-AutoRound

mods:
  - mods/fix-qwen3.5-autoround
  - mods/fix-qwen3.5-chat-template

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  max_model_len: 196608
  gpu_memory_utilization: 0.84
  max_num_batched_tokens: 16384
  max-num-seqs: 16
  load_format: instanttensor
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  speculative_config: '{"method": "mtp", "num_speculative_tokens": 3}'
  coding_config: '{"temperature": 0.7,  "top_p": 0.8, "top_k": 20, "presence_penalty": 0.0, "repetition_penalty": 1.0}'

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"

command: |
  vllm serve {model} \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --host {host} \
    --port {port} \
    --load-format {load_format} \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --speculative-config '{speculative_config}' \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max-num-seqs}  \
    --dtype bfloat16 \
    --kv-cache-dtype fp8_e4m3 \
    --trust-remote-code \
    --attention-backend flashinfer \
    --chat-template unsloth.jinja \
    -tp {tensor_parallel} \
    --generation-config auto \
    --override-generation-config '{coding_config}'
