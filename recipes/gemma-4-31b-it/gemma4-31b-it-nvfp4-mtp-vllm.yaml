recipe_version: "2"
model: nvidia/Gemma-4-31B-IT-NVFP4
runtime: vllm
min_nodes: 1
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-tf5:latest

metadata:
  description: Gemma-4-31B-IT-NVFP4 — NVFP4 quantized Gemma 4 31B IT

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.9
  max_model_len: 131072
  max_num_batched_tokens: 16384
  kv_cache_dtype: fp8
  tool_call_parser: "gemma4"
  reasoning_parser: "gemma4"
  load_format: "fastsafetensors"
  speculative_config: '{"model":"google/gemma-4-31B-it-assistant","num_speculative_tokens":10}'

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"

command: |
  vllm serve {model} \
    --max-model-len {max_model_len} \
    --kv-cache-dtype {kv_cache_dtype} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --host {host} \
    --port {port} \
    --quantization modelopt \
    --load-format {load_format} \
    --enable-prefix-caching \
    --tool-call-parser {tool_call_parser} \
    --enable-auto-tool-choice \
    --reasoning-parser {reasoning_parser} \
    --async-scheduling \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code \
    --speculative-config '{speculative_config}' \
    --language-model-only \
    --tensor-parallel-size 1 \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
