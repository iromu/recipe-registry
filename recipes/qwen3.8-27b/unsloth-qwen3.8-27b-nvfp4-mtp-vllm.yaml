recipe_version: "2"
model: unsloth/Qwen3.8-27B-NVFP4
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest

metadata:
  description: |
    https://huggingface.co/unsloth/Qwen3.8-27B-NVFP4
    
    Thinking Mode: temperature=1.0, top_p=0.95, top_k=20, min_p=0.0, presence_penalty=0.0, repetition_penalty=1.0
    Instruct (or non-thinking) mode: temperature=0.7, top_p=0.80, top_k=20, min_p=0.0, presence_penalty=1.5, repetition_penalty=1.0
    
    GPU KV cache size: 1,707,597 tokens, Maximum concurrency for 262,144 tokens per request: 6.51x


defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
#  gpu_memory_utilization: 0.8 # 2.3x (vs max_model_len=262,144)
  gpu_memory_utilization: 0.8 # 4.7x (vs max_model_len=131,072)
  max_model_len: 131072
  max_num_batched_tokens: 16384
  load_format: instanttensor
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  tool_call_parser: qwen3_xml
  reasoning_parser: qwen3
  mm_encoder_tp_mode: data
  speculative_config: '{"method": "mtp", "num_speculative_tokens": 2}'

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: 1
  LLM_USE_FLASHINFER_MOE_FP4: 0

command: |
  vllm serve {model} \
    --served-model-name Qwen3.8-27B {model} \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --trust-remote-code \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --speculative-config '{speculative_config}' \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --default-chat-template-kwargs '{"reasoning_effort":"medium"}' \
    --limit-mm-per-prompt.image 2 \
    --limit-mm-per-prompt.video 0 \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
