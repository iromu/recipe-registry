recipe_version: "2"
model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
runtime: vllm
max_nodes: 1
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest

metadata:
  description: Nemotron-3-Nano NVFP4 — single node only

mods:
  - mods/nemotron-nano

defaults:
  port: 8001
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.4 # 4.7x (vs max_model_len=262,144)
  max_model_len: 262144
  load_format: fastsafetensors
  tool_call_parser: qwen3_coder
  reasoning_parser: nano_v3

command: |
  vllm serve {model} \
    --served-model-name nemotron-3-nano NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4 nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4 \
    --moe-backend cutlass \
    --max-model-len {max_model_len} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser-plugin nano_v3_reasoning_parser.py \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype fp8 \
    --enable-prefix-caching \
    --load-format {load_format} \
    --gpu-memory-utilization {gpu_memory_utilization}
