recipe_version: "2"
model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
runtime: vllm
max_nodes: 1
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest

metadata:
  description: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.8 # 11.8x (vs max_model_len=262,144)
  max_model_len: 262144
  tool_call_parser: qwen3_coder
  reasoning_parser: nemotron_v3

command: |
  vllm serve {model} \
    --served-model-name nemotron {model}  \
    --moe-backend marlin \
    --max-model-len {max_model_len} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype fp8 \
    --enable-prefix-caching \  
    --mamba-backend flashinfer \
    --mamba-cache-mode align \
    --speculative_config.num_speculative_tokens 3 \
    --speculative_config.model nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DSpark \
    --kv-cache-dtype fp8 \
    --gpu-memory-utilization {gpu_memory_utilization}
