recipe_version: "2"
model: nvidia/NVIDIA-Nemotron-Labs-3-Puzzle-75B-A9B-NVFP4
runtime: vllm
max_nodes: 1
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest

metadata:
  description: nvidia/NVIDIA-Nemotron-Labs-3-Puzzle-75B-A9B-NVFP4
  num_layers: 88

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.8 # 4.3x (vs max_model_len=262,144)
  max_model_len: 262144
  max_num_batched_tokens: 32768
  load_format: instanttensor
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  tool_call_parser: qwen3_coder
  reasoning_parser: nemotron_v3
  speculative_config: '{"method":"mtp","num_speculative_tokens":3}'

command: |
  vllm serve {model} \
    --served-model-name nemotron-3-puzzle {model} \
    --enable-expert-parallel \
    --async-scheduling \
    --trust-remote-code \
    --mamba-backend flashinfer \
    --mamba_ssm_cache_dtype float16 \
    --enable-mamba-cache-stochastic-rounding \
    --mamba-cache-philox-rounds 5 \
    --speculative-config '{speculative_config}' \
    --kv-cache-dtype {kv_cache_dtype} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --attention-backend {attention_backend} \
    --enable-prefix-caching \
    -tp {tensor_parallel} \
    --load-format {load_format} \
    --gpu-memory-utilization {gpu_memory_utilization}
