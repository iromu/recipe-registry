recipe_version: "2"
model: nvidia/Qwen3.6-35B-A3B-NVFP4
runtime: vllm
container: vllm-node

metadata:
  description: |
    vllm-node built on 2026-06-06
    
      ✓       code @ d0  50.9 eff t/s  50.6 stream t/s  α=91.2%  waste=9%  τ=2.7  win=3
      ✓ structured @ d0  56.4 eff t/s  56.0 stream t/s  α=72.4%  waste=28%  τ=2.2  win=3
      ✓       code @ d4096  127.3 eff t/s  126.4 stream t/s  α=89.5%  waste=10%  τ=2.7  win=3
      ✓ structured @ d4096  109.8 eff t/s  109.0 stream t/s  α=74.2%  waste=26%  τ=2.2  win=3
      ✓       code @ d8192  124.3 eff t/s  123.5 stream t/s  α=85.2%  waste=15%  τ=2.6  win=3
      ✓ structured @ d8192  109.5 eff t/s  108.7 stream t/s  α=72.5%  waste=28%  τ=2.2  win=3
      
  
    https://huggingface.co/nvidia/Qwen3.6-35B-A3B-NVFP4
    
    export VLLM_USE_FLASHINFER_MOE_FP4=0
    export VLLM_FP8_MOE_BACKEND=flashinfer_cutlass
    export FLASHINFER_DISABLE_VERSION_CHECK=1
    export CUTE_DSL_ARCH=sm_121a

  
    vllm serve nvidia/Qwen3.6-35B-A3B-NVFP4 --port 8000 --tensor-parallel-size 1 --trust-remote-code --dtype auto 
      --quantization modelopt --kv-cache-dtype fp8 --attention-backend flashinfer --moe-backend marlin 
      --gpu-memory-utilization 0.85 --max-model-len 65536 --max-num-seqs 4 --max-num-batched-tokens 8192 
      --enable-chunked-prefill --async-scheduling --enable-prefix-caching 
      --speculative-config '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
#  gpu_memory_utilization: 0.51 # 4x multiplier
#  gpu_memory_utilization: 0.8 # 7.5x multiplier
  gpu_memory_utilization: 0.9 # 8.7x multiplier
  max_model_len: 262144
  max_num_batched_tokens: 8192
  load_format: instanttensor
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  speculative_config: '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'

env:
   FLASHINFER_DISABLE_VERSION_CHECK: 1
   CUTE_DSL_ARCH: sm_121a

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --served-model-name Qwen3.6-35B-A3B Qwen3.6-35B-A3B-NVFP4 nvidia/Qwen3.6-35B-A3B-NVFP4 \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs 4 \
    --moe-backend marlin \
    --trust-remote-code \
    --language-model-only \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --dtype auto \
    --quantization modelopt \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --speculative-config '{speculative_config}' \
    --enable-chunked-prefill  \
    --async-scheduling  \
    --enable-prefix-caching \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel} \
    --default-chat-template-kwargs '{"preserve_thinking":true}' \
    --generation-config vllm \
    --override-generation-config '{"temperature": 0.6, "top_p": 0.95, "top_k": 20, "min_p": 0.0, "presence_penalty": 0.0, "repetition_penalty": 1.0}'
