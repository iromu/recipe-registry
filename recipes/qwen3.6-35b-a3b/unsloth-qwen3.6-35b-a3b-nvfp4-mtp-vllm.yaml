recipe_version: "2"
model: unsloth/Qwen3.6-35B-A3B-NVFP4-Fast
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest
#container: vllm-node

metadata:
  description: |
    https://howtospark.com/recipes/qwen3-6-35b-a3b-nvfp4-fast
    
    KV cache · FP8 — 4 GiB pinned with --kv-cache-memory-bytes 4294967296 → 343,699 tokens = 1.31x concurrency at 262,144 tokens/request with k=3. 
    Uncapped at util 0.85 the pool takes 75.12 GiB for 29.1x, which one user cannot spend

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.8 #  7.5x (vs max_model_len=131,072) `--kv-cache-memory=76156326298`
  max_model_len: 131072
  max_num_batched_tokens: 8192
  max_num_seqs: 4
  kv_cache_dtype: fp8
  kv_cache_memory_bytes: 76156326298
  tool_call_parser: qwen3_xml
  reasoning_parser: qwen3
  speculative_config: '{"method":"mtp","num_speculative_tokens":3}'

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --served-model-name Qwen3.6-35B-A3B {model} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --trust-remote-code \
    --language-model-only \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --kv-cache-dtype {kv_cache_dtype} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --speculative-config '{speculative_config}' \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel} \
    --default-chat-template-kwargs '{"preserve_thinking":true}' \
    --generation-config vllm \
    --override-generation-config '{"temperature": 0.6, "top_p": 0.95, "top_k": 20, "min_p": 0.0, "presence_penalty": 0.0, "repetition_penalty": 1.0}'

#    --kv-cache-memory-bytes {kv_cache_memory_bytes} \
